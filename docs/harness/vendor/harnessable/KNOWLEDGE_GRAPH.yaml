# KNOWLEDGE_GRAPH.yaml
# Harnessable framework ontology — harnessable namespace only.
# Project-specific concepts and domain namespaces belong in a
# project-level knowledge graph that extends this file.
# See references/knowledge-graph.md for the extension model.
#
# Replaces: GLOSSARY.md

meta:
  version: "0.1.0"
  layer: framework
  extends: null
  description: >
    Authoritative concept graph for the Harnessable operational governance
    framework. Defines roles, artifacts, events, enumerations, and their
    relationships. All concepts are scoped to the harnessable namespace.

namespaces:
  harnessable:
    description: >
      Core concepts of the Harnessable operational governance framework.
      All framework terms are declared here and nowhere else.
    source: internal

# ─────────────────────────────────────────────────────────────────────────────
# ABSTRACT BASE TYPES
# ─────────────────────────────────────────────────────────────────────────────

concepts:

  harnessable.Artifact:
    type: abstract
    definition: >
      A versioned, append-only document produced by a specific Role at a
      defined stage of the pipeline. No Artifact may be edited after its
      stage closes. No Artifact may be created unless the preceding
      Artifact in the chain exists and is complete.
    subclasses: [harnessable.DMT, harnessable.DIP, harnessable.TIR,
                 harnessable.SIR, harnessable.QAVerdict, harnessable.ADR,
                 harnessable.SRR, harnessable.CRR, harnessable.PIR,
                 harnessable.EIR, harnessable.IB, harnessable.AssetPackage,
                 harnessable.EvolutionReport]
    properties:
      append_only: true
      requires_predecessor: true

  harnessable.Role:
    type: abstract
    definition: >
      A functional position in the pipeline. Roles are not personal — one
      human or agent session may perform multiple roles, but the active role
      must be declared explicitly and role boundaries must be preserved at
      all times.
    subclasses: [harnessable.Architect, harnessable.Engineer,
                 harnessable.Coder, harnessable.SRE, harnessable.QA,
                 harnessable.Security, harnessable.Reviewer,
                 harnessable.Inspector, harnessable.EmergencyResponder,
                 harnessable.Analyst, harnessable.Designer,
                 harnessable.ProjectManager, harnessable.Evolver]
    constraints:
      - no_self_approval: true
        note: No Role may verify or accept work it produced.

  harnessable.PipelineRole:
    type: abstract
    subclass_of: harnessable.Role
    definition: >
      A role that gates pipeline progression. Each pipeline role blocks the
      next stage until its artifact is complete and accepted. Invoked by board
      status. Terminates when the next role accepts its artifact.
    subclasses: [harnessable.Architect, harnessable.Engineer,
                 harnessable.Coder, harnessable.SRE,
                 harnessable.QA, harnessable.Security,
                 harnessable.Designer]
    pipeline_gate: true
    invocation: board_status_driven
    output: artifact_that_gates_next_stage

  harnessable.QualityLifecycleRole:
    type: abstract
    subclass_of: harnessable.Role
    definition: >
      A role that operates asynchronously outside the core pipeline. Does not
      gate any pipeline stage. Invoked by Architect investment via a [REVIEW]
      or [INSPECT] mandate. Produces findings and child mandates. Self-closes
      at DONE without Architect acceptance. May run during idle compute.
    subclasses: [harnessable.Reviewer, harnessable.Inspector,
                 harnessable.Analyst]
    pipeline_gate: false
    invocation: architect_investment_mandate
    output: findings_and_child_mandates
    compute_scheduling: may_run_during_idle_compute

  harnessable.BreakGlassRole:
    type: abstract
    subclass_of: harnessable.Role
    definition: >
      A role that bypasses the normal pipeline order when a production system
      is broken and delay is unacceptable. Does not gate any pipeline stage.
      Does not require a pre-existing DMT or DIP. Produces an EIR that becomes
      the input for a mandatory retroactive pipeline pass. Self-closes at
      NEEDS_REVISION — not DONE. The break-glass designation does not suspend
      the Safety Floor or Risk Profile.
    subclasses: [harnessable.EmergencyResponder]
    pipeline_gate: false
    invocation: operator_discretion
    output: harnessable.EIR
    retroactive_requirement: mandatory_within_24h

  harnessable.Enumeration:
    type: abstract
    definition: >
      A closed set of named values used to classify or characterise other
      concepts. Values are exhaustive and mutually exclusive unless noted.
    subclasses: [harnessable.BoardStatus, harnessable.DiscoveryClass,
                 harnessable.VerdictOutcome, harnessable.MandateType]

  harnessable.Event:
    type: abstract
    definition: >
      An occurrence within the pipeline that must be recorded and may
      trigger a state transition or a child mandate.
    subclasses: [harnessable.Discovery]

# ─────────────────────────────────────────────────────────────────────────────
# ROLES
# ─────────────────────────────────────────────────────────────────────────────

  harnessable.Architect:
    type: harnessable.Role
    track: harnessable.PipelineRole
    definition: >
      Defines intent, authors the DMT, and accepts the final QA verdict.
      Owns the mandate from creation to closure.
    produces: [harnessable.DMT]
    accepts: [harnessable.QAVerdict]
    decision_authority:
      - Accepts harnessable.SRR (SECURE_PASS or CONDITIONAL_PASS) and sets DONE
      - Invokes Security review by flagging DMT
    triggers_status:
      on_accept: harnessable.BoardStatus.DONE
    prohibited_from:
      - acting_as_QA_on_same_mandate
    knowledge_graph_obligations:
      at_mandate_open:
        - Ground every domain concept used in the DMT in
          docs/knowledge-graph.yaml before the DMT is finalised.
        - Undefined terms in the DMT are ONTOLOGY_GAP; resolve before
          setting status to MANDATED.
      at_mandate_close:
        - Before accepting the QA verdict and setting DONE, confirm the
          knowledge graph was amended with all concepts discovered during
          the mandate lifecycle.
        - Review all ONTOLOGY_GAP discoveries filed during the mandate
          and verify each was resolved and committed to the graph.
        - A mandate whose graph was not enriched is not fully done.
    rsi_obligations:
      frequency: every_mandate_closure
      conditional_on_failure: false
      closing_step: Framework Observation before setting DONE
      aggregation_step: review ImprovementSignalLog at Step 4 of Mandate Closure Discipline
      meta_mandate_trigger: gap_class recurrence >= 3
      unique_field: propagation — measures distance from gap origin to detection
      recorded_in: board item closing note

  harnessable.Engineer:
    type: harnessable.Role
    track: harnessable.PipelineRole
    definition: >
      Translates the Architect's intent into a complete, implementable plan.
      Runs all recon passes. Must not write implementation code.
    consumes: [harnessable.DMT]
    produces: [harnessable.DIP]
    triggers_status:
      on_start: harnessable.BoardStatus.IN_RECON
      on_complete: harnessable.BoardStatus.PLANNED
    prohibited_from:
      - writing_implementation_code
    knowledge_graph_obligations:
      recon_produces_two_outputs:
        - DIP
        - knowledge graph amendments for every concept encountered during
          recon that is not declared in docs/knowledge-graph.yaml
      constraint: >
        No concept may appear in the DIP using a raw label if it is absent
        from the project graph. File ONTOLOGY_GAP, resolve it, then
        reference the namespaced term in the DIP.
    git_obligations:
      recon_must_verify:
        - git_status_per_codebase: true
        - git_log_per_codebase: true
        - prior_commit_claims_require_sha: true
          note: >
            "Already committed from mandate X" is not evidence.
            Cite the SHA or do not make the claim.
    rsi_obligations:
      frequency: every_session
      conditional_on_failure: false
      closing_step: Framework Observation after Handoff
      committed_as: "chore(recon): — HARNESS_IMPROVEMENT is a recon artifact"
      unique_field: stage — names the specific recon pass or DIP section
      recorded_in: "DIP ## Recon Findings"

  harnessable.Coder:
    type: harnessable.Role
    track: harnessable.PipelineRole
    definition: >
      Executes the DIP exactly as written. Files a Discovery when the plan
      cannot be followed. Produces the TIR with evidence.
    consumes: [harnessable.DIP]
    produces: [harnessable.TIR]
    triggers_status:
      on_start: harnessable.BoardStatus.IN_PROGRESS
      on_complete: harnessable.BoardStatus.IN_REVIEW
    prohibited_from:
      - self_verification
      - proceeding_without_filing_deviation
    knowledge_graph_obligations:
      - File ONTOLOGY_GAP for any concept encountered during implementation
        that is not declared in docs/knowledge-graph.yaml.
      - Halt work until the gap is resolved.
    git_obligations:
      before_in_review:
        - working_directory_clean: true
          check: "git status in every touched codebase"
        - commit_message_matches_diff: true
          check: "git show --stat HEAD"
        - cross_codebase_commits: true
          note: "At least one commit per codebase touched"
      prohibited:
        - uncommitted_work_at_in_review: true
        - commit_message_describes_intent_not_diff: true
    rsi_obligations:
      frequency: every_session
      conditional_on_failure: false
      closing_step: Framework Observation after Exit Gate, before IN_REVIEW
      unique_field: stage — names the implementation step or gate
      recorded_in: "TIR ## Implementation Notes"

  harnessable.SRE:
    type: harnessable.Role
    track: harnessable.PipelineRole
    definition: >
      Executes infrastructure, deployment, and operational mandates
      against live systems. Operates where production state exists
      outside version control, rollback requires a runbook rather than
      a git revert, blast radius extends beyond the codebase, and
      verification is system health rather than test suites.
    produces: [harnessable.SIR]
    consumes: [harnessable.DIP]
    triggers_status:
      on_start: harnessable.BoardStatus.IN_PROGRESS
      on_complete: harnessable.BoardStatus.IN_REVIEW
    prohibited_from:
      - self_verification
      - executing_without_rollback_procedure
      - proceeding_with_degraded_baseline
      - applying_changes_during_failing_health_checks
    git_obligations:
      - commit_iac_before_apply: true
      - working_directory_clean_before_in_review: true
    knowledge_graph_obligations:
      - file_ontology_gap_for_undeclared_infra_concepts: true
      - absent_file_exception: true
    protocol: harnessable.SREProtocol
    rsi_obligations:
      frequency: every_session
      conditional_on_failure: false
      closing_step: Phase 5 Framework Observation
      recorded_in: "SIR ## SRE Sign-Off"

  harnessable.SREProtocol:
    type: concept
    definition: >
      The ordered protocol the SRE agent executes
      during any infrastructure mandate. Begins with
      Pass 0 (world model consultation + failure
      classification) before any reconnaissance or
      action. Closes with post-resolution encoding
      obligation before mandate closure.
    world_model_consultation:
      pass: 0 (first, unconditional)
      searches:
        - world_models/*_world_model.md failure patterns
        - world_models/*_world_model.md vendor capabilities
        - world_models/*_world_model.md known edge cases
        - WORLD_MODEL.md discovery index and cross-repo pointers
      if_match: declare explicitly, follow documented procedure
      if_no_match: proceed with recon, flag for encoding
    failure_classification:
      pass: 0b (before any action)
      document: references/error-modes.md
      declares: mode, signals, layer, loop_permitted,
                prescribed_response
      constraint: >
        Do not act on Loop permitted: NO without
        human approval
    encoding_obligation:
      timing: before mandate closes (not after, not eventually)
      trigger: any pattern not already in world_models/
      format: world_models/{domain}_world_model.md pattern entry
      declaration_required: YES (even when no new pattern)

  harnessable.QA:
    type: harnessable.Role
    track: harnessable.PipelineRole
    definition: >
      Independently verifies the implementation against the DIP and DMT.
      Re-executes checks themselves — does not accept TIR or SIR claims as evidence.
    consumes: [harnessable.TIR, harnessable.SIR]
    produces: [harnessable.QAVerdict]
    constraints:
      - must_not_be_session_that_set: harnessable.BoardStatus.IN_REVIEW
    prohibited_from:
      - accepting_TIR_claims_as_evidence
      - inheriting_checks_from_Coder
    knowledge_graph_obligations:
      - File ONTOLOGY_GAP for any concept encountered during verification
        that is not declared in docs/knowledge-graph.yaml, including
        misclassified alignments or concepts used under incorrect namespaces.
      - Halt verification until the gap is resolved.
    rsi_obligations:
      frequency: every_session
      conditional_on_failure: false
      closing_step: Phase 8 — Framework Observation (mandatory phase)
      unique_field: upstream_opportunity — where could an earlier control have intervened?
      recorded_in: QA Verdict section
      prohibited: skipping Phase 8 — verdict without observation is incomplete

  harnessable.Security:
    type: harnessable.Role
    track: harnessable.PipelineRole
    definition: >
      Performs adversarial security review of implementations.
      Invoked explicitly by the Architect on mandates that touch
      auth, external inputs, credentials, data exposure, privilege,
      or external-facing surfaces. Asks not "does it work?" but
      "can it be made to not work, leak, or be abused?"
    produces: [harnessable.SRR]
    consumes: [harnessable.TIR, harnessable.QAVerdict]
    prerequisite: harnessable.QAVerdict (PASS or CONDITIONAL_PASS)
    invoked_by: harnessable.Architect
    invocation_condition: >
      Architect explicitly flags the DMT for Security review.
      Not automatic. Triggers on: auth changes, external inputs,
      credentials, new external surfaces, data exposure changes,
      privilege changes, new dependencies.
    prohibited_from:
      - running_functional_tests
      - fixing_vulnerabilities_then_passing
      - reviewing_without_qa_pass
      - skipping_threat_surface_map
      - skipping_phase_8
    rsi_obligations:
      frequency: every_session
      conditional_on_failure: false
      closing_step: Phase 8 Framework Observation
      unique_field: upstream_opportunity
      recorded_in: SRR

  harnessable.Reviewer:
    type: harnessable.Role
    track: harnessable.QualityLifecycleRole
    definition: >
      Reads code for structural correctness: error path completeness,
      resource lifecycle, boundary validation, and observability
      adequacy. A quality lifecycle role — not a pipeline gate.
      Produces findings and child mandates; does not produce verdicts
      and does not block pipeline stages.
    produces: [harnessable.CRR]
    consumes: source_files
    invoked_by: harnessable.Architect
    invocation_model: >
      [REVIEW] mandate with declared scope, depth, time budget,
      and finding threshold. Architect-discretionary. May run
      during idle compute. Not attached to any specific core mandate.
    pipeline_position: quality_lifecycle
    pipeline_gate: false
    prohibited_from:
      - blocking_pipeline_stages
      - modifying_reviewed_code
      - filing_must_fix_without_reproducible_condition
      - continuing_past_time_budget
    rsi_obligations:
      frequency: every_session
      conditional_on_failure: false
      recorded_in: CRR Framework Observation section

  harnessable.Inspector:
    type: harnessable.Role
    track: harnessable.QualityLifecycleRole
    definition: >
      Examines code in motion — actual request/response traffic
      flowing across the system's surfaces. Where the Reviewer
      reads source files, the Inspector reads what the running
      system actually does. Quality lifecycle role; not a pipeline
      gate. Produces findings and child mandates. Requires live
      system access, captured traffic logs, or staging replay.
    produces: [harnessable.PIR]
    consumes: traffic_logs_or_live_capture
    invoked_by: harnessable.Architect
    invocation_model: >
      [INSPECT] mandate with declared surfaces, capture method,
      scenario set, finding threshold, and time budget.
      Architect-discretionary.
    traffic_surfaces:
      - HTTP_REST_API
      - CLI
      - MCP_tool_invocations
      - internal_service_to_service
      - webhooks_and_async_events
    pipeline_position: quality_lifecycle
    pipeline_gate: false
    constraints:
      - read_only_or_staging_only: true
      - no_production_mutations: true
    prohibited_from:
      - blocking_pipeline_stages
      - modifying_production_state
      - proceeding_without_confirmed_read_only_access
      - filing_must_fix_without_traffic_evidence
    rsi_obligations:
      frequency: every_session
      conditional_on_failure: false
      recorded_in: PIR Framework Observation section

  harnessable.Analyst:
    type: harnessable.QualityLifecycleRole
    definition: >
      Gathers intelligence from the world outside the codebase —
      competitor moves, user pain signals, practitioner discourse,
      technology shifts — and synthesises it into patterns the
      Architect can act on. Every output is an ExternalFact.
      Training knowledge is not a valid source. Produces an
      Intelligence Brief; does not produce DMTs.
    produces: [harnessable.IB]
    consumes: external_signals_via_web
    invoked_by: harnessable.Architect
    invocation_model: >
      [RESEARCH] mandate declaring domain, signal types,
      time window, and source platforms.
    pipeline_position: quality_lifecycle
    pipeline_gate: false
    primary_tool: docs/harness/tools/web_verify.py
    training_knowledge_as_source: never
    prohibited_from:
      - citing_training_knowledge_as_source
      - treating_single_signal_as_pattern
      - authoring_dmts
      - asserting_competitor_capability_without_fetched_evidence
      - elevating_competitor_claim_without_corroboration
    rsi_obligations:
      frequency: every_session
      conditional_on_failure: false
      recorded_in: IB Framework Observation section

  harnessable.Orchestrator:
    type: harnessable.Role
    definition: >
      The CTO of the engagement. Receives marketplace signals,
      classifies work as templated or novel, commissions domain
      Architects per constituent TOM, dispatches Analysts when
      facing genuine unknowns, synthesises feedback into TOM
      versions, and judges when outcomes are achieved. The only
      role with authority over the full engagement portfolio.
      Does not implement, write DIPs, or write code.
    produces: [harnessable.TOM]
    state_machine: [INITIALISING, RESEARCHING, AUTHORING,
                    EXECUTING, DONE]
    analyst_use: discretionary
    narrator_use: discretionary
    pipeline_position: above_pipeline
    pipeline_gate: false

  harnessable.TOM:
    type: harnessable.Artifact
    label: Target Outcome Mandate
    definition: >
      The founding document of any body of work. Authored by the
      Orchestrator. Declares target outcomes in business language,
      domain context, constraints, and success metrics. Every DMT
      derives from a TOM. The TOM is not written once — it is the
      current best synthesis of everything the discovery loop has
      produced so far. Each version is a snapshot of accumulated
      discovery.
    produced_by: harnessable.Orchestrator
    consumed_by: harnessable.Architect
    path_convention: docs/toms/{slug}/TOM-{version}-{domain}.md
    slug_format: TOM-{version}-{domain}
    versioning: >
      Each pivot increments the version. TOM v1.0 → v1.1 → v2.0
      is the business decision record.
    hierarchy:
      parent: TOM-{version}-{product}
      constituent: TOM-{version}-{fleet-member}

  harnessable.TemplatedEngagement:
    type: concept
    definition: >
      An engagement the Orchestrator recognises from prior completed
      TOMs. No Analyst dispatch needed. The Orchestrator proceeds
      directly to AUTHORING from pattern. What is novel today
      becomes templated tomorrow.

  harnessable.NovelEngagement:
    type: concept
    definition: >
      An engagement containing genuine unknowns the Orchestrator
      cannot resolve from pattern. Requires RESEARCHING phase.
      Analyst dispatched per gap or hypothesis.

  harnessable.Narrator:
    type: harnessable.QualityLifecycleRole
    definition: >
      The voice of the finished work to the marketplace. Reads
      DIPs (the finished good) and produces destination-aware
      communication calibrated to each audience. Simultaneously
      a technical writer, SEO copywriter, marketer, PR spokesperson,
      and outreach ambassador. Never exposes implementation details
      to non-technical audiences. Produces a Communication Package.
    produces: [harnessable.CP]
    raw_material: harnessable.DIP
    invoked_by: harnessable.Orchestrator
    invocation_model: >
      discretionary — not every DONE warrants a Narrator run
    personas: [technical_writer, seo_copywriter, marketer,
               pr_spokesperson, outreach_ambassador]
    pipeline_position: quality_lifecycle
    pipeline_gate: false

  harnessable.CP:
    type: harnessable.Artifact
    label: Communication Package
    definition: >
      Produced by the Narrator. A collection of audience-specific
      communication artifacts, one per declared destination.
      Each artifact is shaped for its destination's format,
      audience, and register. Contains no implementation details
      for non-technical audiences.
    produced_by: harnessable.Narrator
    path_convention: narrator-out/{feature-slug}/
    summary: narrator-out/{feature-slug}/CP-SUMMARY.md

  harnessable.ModelsManifest:
    type: harnessable.Artifact
    label: Models Manifest
    definition: >
      Per-project YAML declaring which model runs each harnessable
      role. Read by the Orchestrator at INITIALISING. Enables
      explicit model selection — specialist models for Security,
      cost-optimised for Coder and SRE, high-capability for
      Orchestrator and Architect.
    path_convention: docs/harness/models.yaml
    template: framework/templates/models.yaml
    consumed_by: harnessable.Orchestrator
    fields:
      model:      model identifier string
      provider:   anthropic | openai | google | cisco | local | other
      cost_tier:  low | medium | high
      rationale:  justification for this model for this role
    roles_declared: 16

  harnessable.SquadReference:
    type: concept
    deprecated: true
    superseded_by: harnessable.RosterScan
    definition: >
      Former static section in engineer.md listing all role profiles
      inline. Replaced by the Role Roster dynamic protocol: the
      Engineer now scans docs/harness/agents/*.md on every invocation
      rather than reading a cached profile table. The role profiles
      live in individual agent files; the Engineer reads them from
      disk, not from a snapshot in the Engineer protocol.
    was_encoded_in: framework/agents/engineer.md ## Squad Reference
    now_encoded_in: framework/agents/engineer.md ## Role Roster
    mandatory_triggers:
      - code_changes_plus_live_operations → Coder + SRE
      - auth_credentials_network_surface  → Security mandatory
      - implementation_done               → QA always
    enforces:
      - Role-annotated Implementation Steps in multi-role DIPs
      - Pre-structured TIR sections per executing role
      - Coder boundary rule: BLOCKER not workaround at boundaries
      - SRE handoff: Pass 0 (world model + failure classification) + baseline + rollback + observation window
      - Security non-optional for security-relevant mandates

  harnessable.Rubric:
    type: concept
    definition: >
      The complete set of verifiable criteria that define DONE for
      a mandate. The same pattern LangChain formalises as
      RubricMiddleware: define what done looks like upfront,
      evaluate output against it, feed per-criterion findings back,
      loop until satisfied. In harnessable the Rubric has three
      layers and is evaluated by the QA role (the grader).
    layers:
      acceptance_criteria:
        source: DMT
        owner: Architect
        definition: >
          Business-level declaration of what the mandate achieves.
          Written before implementation begins.
      verification_checklists:
        source: DIP
        owner: Engineer
        definition: >
          Implementation-level checks the Coder/SRE must satisfy.
          [REQUIRED] items are mandatory rubric criteria.
      completion_gate:
        source: AGENTS.md
        owner: project
        definition: >
          Automated shell commands that must exit 0.
          Hard evidence — not model reasoning.
    evaluated_by: harnessable.QA
    feedback_mechanism: harnessable.QAVerdict per-criterion table
    loop_states:
      satisfied: QA issues PASS — mandate advances to DONE
      partial: QA issues CONDITIONAL_PASS — Architect accepts or
               returns to NEEDS_REVISION
      failed: QA issues FAIL — MUST_FIX items present —
              mandate returns to NEEDS_REVISION
      escalated: loop exhausted — Architect decides
    analogous_to: LangChain RubricMiddleware
    note: >
      harnessable arrived at this pattern independently from
      institutional project governance. LangChain arrived at it
      from automated agent evaluation. The structural identity
      validates both designs.

  harnessable.RubricLoop:
    type: concept
    definition: >
      The evaluation and correction cycle driven by the Rubric.
      Engineer → Coder/SRE → QA → [NEEDS_REVISION → repeat].
      Terminates on QA PASS or Architect escalation. Human-gated
      by design: high-stakes production work should not loop
      autonomously. The board state machine enforces the loop.
    loop_sequence:
      - Engineer authors DIP (Rubric declared)
      - Coder/SRE implements
      - QA evaluates per criterion
      - PASS → DONE
      - CONDITIONAL_PASS → Architect accepts or NEEDS_REVISION
      - FAIL → NEEDS_REVISION → Engineer → Coder/SRE → QA
    differs_from_automated_rubric: >
      Human approves each loop iteration via board state.
      No max_iterations cap — Architect decides when to escalate.

  harnessable.WorldModelDirectory:
    type: concept
    definition: >
      A directory of domain-specific world model files.
      Each file models one operational domain precisely
      using the *_world_model.md naming convention.
      Replaces the single WORLD_MODEL.md approach which
      cannot model something as complex as a fleet
      application's operational world. The same lesson
      as agents/*.md — one file trying to hold everything
      grows unbounded and becomes incoherent.
    path_convention: world_models/*_world_model.md
    discovery: find world_models/ -name "*_world_model.md"
    pointer_syntax: >
      → world_models/domain_world_model.md
      → ../other-repo/world_models/domain_world_model.md
    index: WORLD_MODEL.md (thin discovery index at root)
    security: >
      Must be in a PRIVATE repository.
      Real IPs, node names, and service topology
      in a public repo are a security incident.
    seed_templates:
      - framework/templates/world_models/fleet_world_model.md
      - framework/templates/world_models/vendor_world_model.md
      - framework/templates/world_models/staging_world_model.md

  harnessable.DomainWorldModel:
    type: harnessable.Artifact
    label: Domain World Model
    definition: >
      A single world model file scoped to one
      operational domain. Bounded, coherent, focused.
      Agents read only the domain files relevant to
      their mandate. New domains add new files.
      Files may point to world models in other
      private fleet repositories.
    naming_convention: "{domain}_world_model.md"
    path_convention: world_models/{domain}_world_model.md
    project_owned: true
    framework_never_modifies: true
    pointer_graph: distributed across private fleet repos
    domain_examples:
      - fleet (topology, service graph, trust boundaries)
      - vendor (capabilities, recovery tools)
      - staging (staging-specific topology and edge cases)
      - oauth (complete auth flow across fleet)
      - tenant (isolation model, blast radius)
      - billing (payment states, activation flows)
      - api (contract surface, quota limits)

  harnessable.RosterScan:
    type: concept
    definition: >
      The first action of every Engineer invocation.
      Scans docs/harness/agents/*.md and project package
      adapters to discover the current generation of the
      framework's capability surface. The roster is what
      exists on disk — not what any document says, not
      what was true at install time. New roles appear
      here first. Deprecated roles disappear from here.
      Package skills may extend the roster without
      becoming framework roles. The Engineer that plans
      from a cached mental model plans from a previous
      generation.
    command: ls docs/harness/agents/*.md
    package_adapter_commands:
      - ls packages/*/PACKAGE.md
      - ls packages/*/skills/*.md
    timing: before reading mandate, before planning,
            before authoring DIP
    for_each_file:
      - read ## Role Scope (Reach and Hard limits)
      - understand when to commission this role
      - if unseen before: read full file before planning
    package_adapter_scan:
      - read PACKAGE.md
      - read harnessable: block if present
      - note package skills, role extensions, Rubric additions,
        and world model templates
    gap_detection: >
      After scan, map every mandate step to an
      available role. Steps with no role match
      or package skill match trigger a Protocol
      Enhancement Request.

  harnessable.PackageAdapter:
    type: concept
    label: Package Adapter
    definition: >
      A project-local governance bridge at packages/{name}/
      that wraps an installed third-party package in
      harnessable conventions without copying or owning
      the package. Discovered by the Engineer during
      roster scan. May declare role extensions, Rubric
      additions, package skills, and world model templates.
    path_convention: packages/{name}/
    manifest: packages/{name}/PACKAGE.md
    project_owned: true
    framework_never_modifies: true
    not_a_framework_role: true
    discovered_by: harnessable.Engineer
    discovery_commands:
      - ls packages/*/PACKAGE.md
      - ls packages/*/skills/*.md

  harnessable.PackageSkill:
    type: concept
    label: Package Skill
    definition: >
      A command wrapper declared by a Package Adapter.
      Invokes installed third-party domain expertise
      inside a governed harnessable session. May appear
      in the Execution Manifest when the adapter's
      harnessable declaration covers a mandate step.
    path_convention: packages/{name}/skills/*.md
    declared_by: harnessable.PackageAdapter
    may_appear_in: harnessable.ExecutionManifest
    not_a_framework_role: true

  harnessable.ExecutionManifest:
    type: harnessable.Artifact
    label: Execution Manifest
    definition: >
      An explicit ordered sequence of agent invocation
      commands included in every DIP. Makes the DIP
      fully self-contained — the operator reads once
      and knows exactly what to run in what order.
      No interpretation required. Resume point is
      clear after any failure.
    format: "N) /role-name path/to/dip.md"
    location: ## Execution Manifest section of DIP
    authored_by: harnessable.Engineer
    gap_notation: >
      N) [GAP] — PER filed: docs/mandates/per/PER-NNN.md
      Used when a manifest step has no available role.
    rules:
      - one line per agent session
      - role must exist in docs/harness/agents/
      - order reflects execution dependency
      - QA always follows the role it verifies
      - SRE deployment follows Coder implementation

  harnessable.ProtocolEnhancementRequest:
    type: harnessable.Artifact
    label: Protocol Enhancement Request
    abbreviation: PER
    definition: >
      Filed by the Engineer when a roster scan reveals
      no existing role that covers a mandate step.
      The Engineer holds the complete picture: what
      needs doing AND what the framework can currently
      do. The delta is the enhancement signal. No
      other agent has this vantage point. PERs are
      high-signal Dreamer corpus input. The Evolver
      acts on recurring PER patterns.
    path_convention: docs/mandates/per/PER-{NNN}.md
    filed_by: harnessable.Engineer
    read_by: harnessable.Dreamer (high-signal corpus)
    actioned_by: harnessable.Evolver
    template: framework/templates/per.md
    status_values:
      - OPEN
      - RESOLVED (new role created or mutation applied)
      - DECLINED (gap does not warrant a role)
    loop: >
      Engineer files PER (gap detected)
      Dreamer reads PERs across fleet (pattern)
      Evolver decides: new role / mutation / decline
      New role appears in docs/harness/agents/
      Engineer scans roster — gap is gone

  harnessable.IncidentRecord:
    type: harnessable.Artifact
    label: Incident Record
    definition: >
      Full record of a resolved production incident.
      Captures what was learned — the pattern, the tool,
      the procedure — distinct from what was done (SIR).
      Lives in docs/incidents/ at project root.
      Project-owned, outside docs/harness/.
    path_convention: docs/incidents/YYYY-MM-DD-{slug}.md
    project_owned: true
    framework_never_modifies: true
    required_sections:
      - Symptom
      - Root Cause
      - Layer
      - Discovery Path
      - Resolution
      - Knowledge Extracted
      - world_models/ update

  harnessable.FailureMode:
    type: concept
    definition: >
      A named, classified category of agent failure with
      observable signals, cause layer, prescribed response,
      and back-off strategy. The classifier's unit of
      recognition. Encoded in references/error-modes.md.
      Every unrecognized failure that recurs becomes a
      new named mode.
    document: framework/vendor/harnessable/references/error-modes.md
    modes:
      - IMPLEMENTATION_ERROR
      - ENVIRONMENT_FAILURE
      - SPECIFICATION_CONFLICT
      - BELOW_HORIZON
      - OSCILLATION
      - REGRESSION
      - CONTEXT_CORRUPTION
      - MISSING_PREREQUISITE
      - SCOPE_OVERFLOW
      - RATE_EXHAUSTION
      - UNRECOGNIZED_PATTERN
    principle: >
      Failure is information. Classify before acting.
      No autonomous loop without a structurally separate
      observer that holds stop authority.

  harnessable.BackPressureSignal:
    type: concept
    definition: >
      Model-layer signal that manifests in output text
      before any programmatic hook fires. The model itself
      is an observer. Back-pressure is the earliest
      warning in the stack — preceding exit codes,
      test failures, and Completion Gate results.
      Readable only by a classifier with a fresh context;
      the acting agent cannot observe its own back-pressure.
    signals:
      THROTTLING: >
        Hedging density rising, unsolicited warnings,
        unprompted confirmation requests, caveat-to-content
        ratio increasing. Early CONTEXT_CORRUPTION signal.
      JAIL_TIME: >
        Refusals on previously executed actions.
        Cascade property: contaminates adjacent actions.
        Requires context discard, not negotiation.

  harnessable.ClassifierAgent:
    type: concept
    definition: >
      A structurally separate observer that reads failure
      signals from an acting agent's session and routes
      to the prescribed response per error-modes.md.
      Not a role — a pattern. Instantiated as QA role,
      human board gate, or dedicated observer session
      depending on risk level. Holds stop authority
      unconditionally. Must hold a fresh context with
      no shared contamination from the acting agent.
    document: >
      framework/vendor/harnessable/references/classifier.md
    requirements:
      - fresh_context: no shared contamination
      - stop_authority: unconditional
      - reads: error-modes.md
      - reads: world_models/*_world_model.md failure patterns
      - observes: programmatic signals (Layer 1)
      - observes: model behaviour signals (Layer 2)
    instantiations:
      qa_role:
        context: Rubric loop
        separation: fresh CC session reads TIR as artifact
        loop: human-gated via board state
      human:
        context: board gate (all mandate transitions)
        separation: inherent
        loop: explicit human decision to re-open
      observer_session:
        context: high-risk automated loops
        separation: fresh CC session
        loop: observer holds stop authority
    principle: >
      No autonomous loop is safe without a classifier.
      No classifier is valid without separation.
      No loop is safe without an iteration cap.

  harnessable.VisibilityHorizon:
    type: concept
    definition: >
      The layer below which neither the acting agent
      nor the classifier can observe the cause of a
      failure. Symptoms manifest at the observable layer
      while the cause lives below it. Agent capability
      is not the limitation — pattern recognition is.
      If the pattern exists in a relevant
      world_models/*_world_model.md file the agent can
      execute recovery autonomously. If not, no amount
      of retrying at the observable layer will reveal a
      below-horizon cause.
    layers:
      below_horizon: Hardware, Firmware, Bootloader, Kernel
      agent_layer:   OS, Network, Services, Application
      model_layer:   Model reasoning, back-pressure signals
    failure_mode: BELOW_HORIZON (see error-modes.md)
    resolution: >
      Search world_models/ for a matching pattern.
      If match: execute documented recovery.
      If no match: package observable state,
      request lower-layer access, stop.

  harnessable.BackOffStrategy:
    type: concept
    definition: >
      The prescribed response when a failure mode
      declares Loop permitted: NO. Distinct from retry.
      Retry attempts the same operation again.
      Back-off stops, packages observable state,
      declares what is needed to proceed, and halts
      further action at the failing layer.
      Back-off without a package is just stopping.
      Back-off with a package is actionable escalation.
    components:
      - stop: halt all action on the failing path
      - package: collect observable state completely
      - declare: what access or prerequisite is needed
      - halt: do not consume further time at wrong layer
    contrast_with: retry (same operation, same layer)
    escalation_package:
      - observable symptoms (exact)
      - last known good state (timestamp)
      - all attempted actions (what, when, result)
      - exhaustion evidence
      - access request (KVM, IPMI, console, human)

  harnessable.SessionCostLog:
    type: harnessable.Artifact
    label: Session Cost Log
    definition: >
      Monthly JSONL log of token consumption per agent
      session. Written by hooks/stop/session_cost.py at
      session end. Each entry declares role, mandate,
      model, token counts, and estimated USD cost
      cross-referenced against the Models Manifest.
      Feeds session_cost_report.py for Orchestrator
      budget decisions.
    path_convention: .harnessable/logs/session-cost.YYYY-MM.jsonl
    written_by: hooks/stop/session_cost.py
    read_by: framework/tools/session_cost_report.py
    entry_fields:
      - ts
      - session_id
      - role
      - mandate
      - model
      - input_tokens
      - output_tokens
      - total_tokens
      - tool_calls
      - duration_seconds
      - estimated_cost_usd

  harnessable.TokenBudget:
    type: concept
    definition: >
      Optional per-role cost ceiling declared in
      AGENTS.md ## Token Budget. Allows the Orchestrator
      to make informed model assignment decisions and
      flag sessions that exceed expected cost. Compared
      against SessionCostLog entries by
      session_cost_report.py.
    declared_in: AGENTS.md ## Token Budget
    enforced_by: session_cost_report.py (advisory)
    note: >
      Enforcement is advisory — the Stop hook logs cost
      but does not block session exit on budget overrun.
      Budget overruns surface in the report for human
      review, not as automated blocks.

  harnessable.OperatorStep:
    type: concept
    definition: >
      A DIP Implementation Step requiring human action that no
      agent can perform. Declared with [OPERATOR] label. The agent
      writes exact instructions and evidence requirements; the
      human executes and returns evidence to the session.
      QA verifies evidence exists and matches pass criteria —
      it cannot re-execute the step independently.
    dip_label: "[OPERATOR]"
    rubric_layer: Verification Checklist
    qa_evidence_requirement: >
      Human-captured (screenshot, log, confirmation text).
      Absent evidence = BLOCKED, not PASS.
    failure_mode: >
      Undeclared OPERATOR steps are invisible to QA.
      The mandate appears complete when it is not.

  harnessable.Designer:
    type: harnessable.PipelineRole
    definition: >
      Produces pixel-precise visual artifacts from written
      specifications. Never makes aesthetic decisions — every
      colour, coordinate, size, and opacity comes from the
      specification. At ambiguity: files BLOCKER. Output is
      static files (SVG, PNG, ICO, WebP), not application code.
      Verification uses ImageMagick identify for dimension
      confirmation.
    produces: [harnessable.AssetPackage]
    tool_surface:
      - svgo: SVG optimisation
      - cairosvg: SVG → PNG/PDF raster export
      - ImageMagick: resize, composite, ICO, dimension verify
      - Inkscape CLI: SVG → PNG with exact pixel rendering
      - ffmpeg: motion asset export
    pipeline_position: pipeline
    pipeline_gate: true
    dip_step_label: "[Designer]"
    blocker_threshold: any_ambiguity_in_specification
    prohibited_from:
      - making_aesthetic_decisions
      - installing_GUI_design_tools
      - producing_assets_without_specification
      - committing_to_undeclared_paths

  harnessable.ProjectManager:
    type: harnessable.Role
    definition: >
      The connector between the marketplace and the technical team.
      Faces outward — toward stakeholders, customers, partners, and
      other teams. The Orchestrator faces inward. The PM negotiates
      what comes in; the Orchestrator decides how it gets executed.
      Not in the technical pipeline. Produces communication,
      coordination, and administrative outputs — not pipeline
      artifacts. Serves multiple teams simultaneously; may be
      external to the teams it serves.
    produces: [stakeholder_communication, status_reports,
               meeting_notes, calendar_commitments, contracts]
    tool_surface:
      - Gmail MCP: email drafting, sending, inbox triage
      - Google Calendar MCP: scheduling, commitment tracking
      - Google Drive MCP: documents, contracts, invoices
      - GitHub Projects MCP: board state reads, issue filing
      - Narrator output: PM deploys CP to declared destinations
    pipeline_position: external_facing
    pipeline_gate: false
    prohibited_from:
      - making_technical_decisions
      - authoring_toms_or_dips_or_pipeline_artifacts
      - commissioning_or_directing_pipeline_roles
      - committing_to_technical_timelines_without_orchestrator
      - exposing_internal_complexity_to_stakeholders
    orchestrator_interface: >
      PM is the single point of contact to the Orchestrator.
      Technical decisions are routed as Decision Requests.
      The Orchestrator's reasoning is never exposed verbatim.

  harnessable.AssetPackage:
    type: harnessable.Artifact
    label: Asset Package
    definition: >
      Produced by the Designer. A committed collection of
      visual asset files (SVG masters, PNG exports, favicons,
      OG images) derived from a single SVG source of truth.
      Includes a manifest of every file with dimensions and
      commit SHA.
    produced_by: harnessable.Designer
    path_convention: public/brand/ or DIP-declared path
    verification: >
      identify -format "%wx%h %f\n" *.png
      All files at declared dimensions, committed.

  harnessable.PlaywrightStep:
    type: concept
    definition: >
      A DIP Implementation Step requiring browser automation via
      Playwright. Declared with [PLAYWRIGHT] label. The Coder writes
      the test file; QA or Inspector re-executes independently and
      captures fresh evidence. Self-reported Coder pass is never
      sufficient — QA must run and evidence independently.
    dip_label: "[PLAYWRIGHT]"
    rubric_layer: Verification Checklist
    runtime: "npx playwright test | python -m pytest (playwright)"
    evidence: exit_code + stdout + screenshot_path
    prerequisite: Playwright declared available in AGENTS.md ## Browser Testing
    qa_evidence_requirement: >
      Independent re-execution by QA or Inspector.
      Screenshot at test-results/{name}.png.
    failure_mode: >
      Undeclared PLAYWRIGHT steps are invisible to the Rubric.
      Browser-required acceptance tests silently never run.

  harnessable.RoleScope:
    type: concept
    definition: >
      A standard section in every agent protocol declaring that
      role's Reach, Hard limits, and At-the-boundary protocol.
      Makes each role self-aware of its own capability surface
      without requiring the agent to read the Engineer's Squad
      Reference. Present in all 13 agent files.
    section_heading: "## Role Scope"
    present_in: all 13 agent protocol files
    fields:
      reach:          what this role can and should do
      hard_limits:    what this role must never do
      at_the_boundary: what to do when a limit is reached

  harnessable.CommunicationChannel:
    type: concept
    definition: >
      A declared destination in AGENTS.md ## Communication Channels.
      Specifies the channel URL, format, and audience. The Narrator
      reads the channel registry before producing any output.
    declared_in: AGENTS.md ## Communication Channels
    consumed_by: harnessable.Narrator

  harnessable.IB:
    type: harnessable.Artifact
    label: Intelligence Brief
    definition: >
      Produced by the Analyst after gathering and synthesising
      external signals. Contains a signal inventory with source
      classification, identified patterns with confidence levels,
      and implications for the Architect. Does not contain DMTs.
      The Analyst recommends; the Architect decides.
    produced_by: harnessable.Analyst
    consumed_by: harnessable.Architect
    path_convention: >
      docs/mandates/research/{domain}_{date}_intelligence_brief.md
    pipeline_position: quality_lifecycle
    finding_classes:
      pattern:
        confidence_levels: [HIGH, MEDIUM, OBSERVED]
        minimum_signals:
          HIGH: 5
          MEDIUM: 3
          OBSERVED: 1
    constraint: >
      Every claim must have a fetched URL and date.
      Training knowledge may not appear as a source.

  harnessable.SignalClass:
    type: concept
    definition: >
      Classification applied to every signal gathered by the Analyst.
      Determines epistemic weight in synthesis.
    values:
      VERIFIED_USER:
        definition: >
          Documented user of the product or category speaking from
          direct experience. Highest weight for product feedback.
      PRACTITIONER:
        definition: >
          Demonstrably skilled domain professional. Highest weight
          for technical assessment and workflow patterns.
      ANALYST_OPINION:
        definition: >
          Industry analyst, researcher, or journalist. Useful for
          market framing. Moderate weight.
      COMMUNITY_SIGNAL:
        definition: >
          Unverified forum or social media participant. Weight scales
          with N independent sources, not individual post quality.
      COMPETITOR_CLAIM:
        definition: >
          Competitor's own marketing, documentation, or changelog.
          Face-value skepticism. Always pair with VERIFIED_USER or
          COMMUNITY_SIGNAL where possible.

  harnessable.EmergencyResponder:
    type: harnessable.Role
    track: harnessable.BreakGlassRole
    definition: >
      A break-glass role invoked when a production system is broken and the
      normal pipeline cannot be followed without unacceptable delay. Bypasses
      the Architect → Engineer → Coder sequence. Fixes first and documents
      concurrently. Leaves a trail (the EIR board item) as the basis for a
      mandatory retroactive DIP and QA pass within 24 hours.
    produces: [harnessable.EIR]
    triggers_status:
      on_start: harnessable.BoardStatus.IN_PROGRESS
      on_complete: harnessable.BoardStatus.NEEDS_REVISION
    pipeline_gate: false
    invocation: >
      Any operator may invoke the Emergency Responder when a production
      system is broken and speed is paramount. No Architect pre-approval
      required. The EIR substitutes for a DMT+DIP+TIR until the retroactive
      pass is completed.
    retroactive_requirements:
      within_24h:
        - DIP authored from EIR findings
        - QA verification of the fix
        - Child mandates created for every DISCOVERY filed
    prohibited_from:
      - ending_session_without_eir
      - leaving_architectural_findings_as_prose
      - marking_fix_complete_without_verification_output
      - creating_child_mandates_during_emergency
      - bypassing_agents_md_safety_floor
    safety_floor_applies: true
    note: >
      The Safety Floor declared in AGENTS.md is never suspended
      during an emergency. A blocked action is a BLOCKER to
      escalate, not a constraint to bypass.
    rsi_obligations:
      frequency: every_session
      conditional_on_failure: false
      recorded_in: EIR DISCOVERY entries

  harnessable.Spike:
    type: harnessable.Role
    definition: >
      Executes impromptu, exploratory, or micro-fix work within a declared
      time box and scope boundary. Not reactive to production crisis —
      proactive and low-stakes. Branch-first: the git branch name states
      intent and the commit history is the trail. Abandonment is a valid
      and complete outcome. Escalates to the full pipeline when scope
      expands beyond the declared intent or Safety Floor is required.
    produces: [harnessable.SpikeBranch]
    pipeline_gate: false
    time_boxed: true
    default_time_box: 2h
    max_recommitments: 1
    valid_exits:
      Ship:
        definition: Work complete. PR opened. Commits clean.
        produces: pull_request
        child_mandates: required for HARNESS_IMPROVEMENT and ONTOLOGY_GAP
      Abandon:
        definition: >
          Approach invalid or scope larger than declared. One-sentence note
          filed. Branch deleted. No retroactive DIP.
        produces: abandonment_note
      Escalate:
        definition: >
          Scope expanded, DIP-level decision required, Safety Floor action
          needed, or production bug discovered. DEVIATION filed. Branch
          becomes input to full pipeline mandate or Emergency.
        produces: harnessable.Mandate
    prohibited_from:
      - merging_to_main_without_pr
      - exceeding_time_box_without_recommitment
      - expanding_scope_without_deviation
      - leaving_discoveries_only_in_conversation
      - bypassing_safety_floor
      - starting_without_branch
      - non_descriptive_branch_names

  harnessable.SpikeBranch:
    type: harnessable.Artifact
    label: Spike Branch
    definition: >
      The git branch created at the start of a Spike session. The branch
      name states intent. The commit history is the trail. DISCOVERY
      entries appear in commit messages. The branch either becomes a PR
      (Ship) or is deleted (Abandon). No separate document required.
    produced_by: harnessable.Spike
    path_convention: spike/{short-description}
    constraints:
      - branch_name_must_be_descriptive: true
        invalid_names: [spike/fix, spike/test, spike/misc, spike/temp]
      - discovery_entries_in_commits_not_conversation: true
      - no_direct_to_main_merge: true

# ─────────────────────────────────────────────────────────────────────────────
# ARTIFACTS
# ─────────────────────────────────────────────────────────────────────────────

  harnessable.DMT:
    type: harnessable.Artifact
    label: Design Mandate Task
    definition: >
      The authoritative source that defines the mandate: its problem statement,
      acceptance criteria, constraints, and out-of-scope declarations. The
      source of truth for what a mandate is supposed to achieve.
    produced_by: harnessable.Architect
    consumed_by: harnessable.Engineer
    required_before: harnessable.DIP
    triggers_status: harnessable.BoardStatus.MANDATED
    source_variants:
      BoardTask:
        description: >
          Created in the project tracker. Has a URL, board status, and comments.
          Preferred when a project uses a board.
      LocalFile:
        description: >
          A Markdown file checked into docs/mandates/ or equivalent. No board
          item required.
      InlineDescription:
        description: >
          Text passed directly to the Engineer agent. No persistent file,
          no board item.
    notes:
      authority: All source variants carry identical authority once resolved.

  harnessable.DIP:
    type: harnessable.Artifact
    label: Design Implementation Plan
    definition: >
      Produced by the Engineer. Describes how to implement the DMT: recon
      findings, architecture decisions, ordered implementation steps,
      verification checklists, and containment plan.
    produced_by: harnessable.Engineer
    consumed_by: harnessable.Coder
    requires: harnessable.DMT
    required_before: harnessable.TIR
    triggers_status: harnessable.BoardStatus.PLANNED
    contains: [harnessable.TIR, harnessable.SIR, harnessable.QAVerdict, harnessable.ADR]
    path_convention: docs/mandates/{bucket}/{slug}_implementation_plan.md
    constraints:
      - immutable_after: harnessable.BoardStatus.PLANNED
        exception: "## Post-Close Notes section only"

  harnessable.TIR:
    type: harnessable.Artifact
    label: Task Implementation Report
    definition: >
      Produced by the Coder during and after implementation. Contains what
      was actually built, evidence (verification output, domain-specific
      checks, health probes), deviation records, and the Coder's sign-off
      checklist.
    produced_by: harnessable.Coder
    consumed_by: harnessable.QA
    requires: harnessable.DIP
    required_before: harnessable.QAVerdict
    embedded_in: harnessable.DIP
    triggers_status: harnessable.BoardStatus.IN_REVIEW
    constraints:
      - evidence_required: true
        note: Claims without verifiable output are invalid. "It should work" is not evidence.

  harnessable.SIR:
    type: harnessable.Artifact
    label: SRE Implementation Report
    definition: >
      Produced by the SRE during and after infrastructure execution.
      Embedded as a section in the DIP. Contains pre-change baseline,
      step-by-step change execution log with actual output, incident
      notes if any, observation window evidence, and rollback status.
    produced_by: harnessable.SRE
    consumed_by: harnessable.QA
    requires: harnessable.DIP
    required_before: harnessable.QAVerdict
    embedded_in: harnessable.DIP
    triggers_status: harnessable.BoardStatus.IN_REVIEW
    constraints:
      - pre_change_baseline_required: true
      - observation_window_required: true
      - rollback_viability_confirmed: true
    knowledge_extracted:
      required: true
      timing: before mandate closes
      branches:
        YES: >
          Full pattern encoding matching
          world_models/{domain}_world_model.md pattern format.
          world_models/ update confirmed with commit SHA.
        NO: >
          Explicit declaration required.
          Silence is not permitted.

  harnessable.QAVerdict:
    type: harnessable.Artifact
    label: QA Verdict
    definition: >
      The outcome of independent verification against the DIP and DMT.
      Appended to the DIP. Drives the final status transition.
    produced_by: harnessable.QA
    consumed_by: harnessable.Architect
    requires: harnessable.TIR
    embedded_in: harnessable.DIP
    valid_values:
      PASS:
        definition: >
          All required checks executed and passed. All DMT acceptance criteria
          satisfied. TIR evidence complete and verified.
        triggers_status: harnessable.BoardStatus.VERIFIED
      CONDITIONAL_PASS:
        definition: >
          All required checks pass but minor issues exist that do not block
          the mandate's core outcome.
        triggers_status: harnessable.BoardStatus.VERIFIED
        note: Use sparingly — accumulating conditions makes this a FAIL.
      FAIL:
        definition: >
          One or more required checks failed, or DMT acceptance criteria not
          met, or TIR evidence insufficient for verification.
        triggers_status: harnessable.BoardStatus.NEEDS_REVISION
    per_criterion_table:
      required: true
      format: >
        | # | Criterion | Source | Verdict | Evidence |
        Each row maps one Rubric criterion to a verdict.
        Source: Acceptance Criteria | Verification Checklist |
                Completion Gate
        Verdict: PASS | FAIL | PARTIAL | BLOCKED
        Evidence: exact command output, commit ref, or
                  statement of what is needed to flip to PASS
    overall_verdict_derivation: >
      PASS: all criteria PASS
      CONDITIONAL_PASS: no FAIL, at least one SHOULD_FIX
      FAIL: any MUST_FIX criterion is FAIL or PARTIAL

  harnessable.SRR:
    type: harnessable.Artifact
    label: Security Review Report
    definition: >
      Produced by the Security reviewer after adversarial review
      of a QA-passed implementation. Contains threat surface map,
      findings table with severity classification, child task
      references, and verdict. Appended to the DIP.
    produced_by: harnessable.Security
    consumed_by: harnessable.Architect
    requires: harnessable.QAVerdict
    embedded_in: harnessable.DIP
    valid_values:
      SECURE_PASS:
        definition: No CRITICAL or HIGH findings.
        triggers_status: harnessable.BoardStatus.VERIFIED
      CONDITIONAL_PASS:
        definition: >
          No CRITICAL findings. HIGH findings with documented
          Architect risk acceptance.
        triggers_status: harnessable.BoardStatus.VERIFIED
      FAIL:
        definition: CRITICAL findings or HIGH without risk acceptance.
        triggers_status: harnessable.BoardStatus.NEEDS_REVISION

  harnessable.CRR:
    type: harnessable.Artifact
    label: Code Review Report
    definition: >
      Produced by the Reviewer after reading code for structural
      correctness. Standalone document — not embedded in a DIP.
      Contains findings classified as MUST_FIX, SHOULD_FIX,
      CONSIDER, or NITPICK, and a log of child mandates filed.
    produced_by: harnessable.Reviewer
    consumed_by: harnessable.Architect
    path_convention: >
      docs/mandates/review/{component}_{date}_code_review_report.md
    pipeline_position: quality_lifecycle
    triggers_child_mandates: true
    finding_classes:
      MUST_FIX:
        definition: >
          Correctness failure. Will manifest under specific conditions.
          Creates child mandate unconditionally.
        creates_mandate: always
      SHOULD_FIX:
        definition: >
          Robustness deficiency. Degrades reliability over time.
          Creates child mandate at default threshold.
        creates_mandate: default
      CONSIDER:
        definition: >
          Improvement opportunity. Code is defensible as-is.
          Creates mandate only if Architect raises threshold.
        creates_mandate: architect_decision
      NITPICK:
        definition: >
          Style or consistency observation. Never creates a mandate
          without explicit Architect decision.
        creates_mandate: never_default

  harnessable.PIR:
    type: harnessable.Artifact
    label: Protocol Inspection Report
    definition: >
      Produced by the Inspector after analysing request/response
      traffic across declared surfaces. Standalone document — not
      embedded in a DIP. Contains findings with traffic evidence,
      and child mandates filed.
    produced_by: harnessable.Inspector
    consumed_by: harnessable.Architect
    path_convention: >
      docs/mandates/inspect/{surface}_{date}_inspection_report.md
    pipeline_position: quality_lifecycle
    requires: traffic_capture_or_live_access
    finding_classes: same_as harnessable.CRR
    constraints:
      - evidence_required: true
        note: >
          Every MUST_FIX and SHOULD_FIX finding requires a specific
          request/response excerpt as evidence. Protocol observations
          without traffic evidence are CONSIDER at most.

  harnessable.EIR:
    type: harnessable.Artifact
    label: Emergency Investigation Report
    definition: >
      Produced by the Emergency Responder during and after a break-glass fix.
      Lives as a board item (title prefixed [EMERGENCY]) or as a local file
      at docs/mandates/emergency/{date}_{slug}_eir.md when no tracker is
      available. Combines the roles of DMT, DIP, and TIR under time pressure.
      Must contain: symptom, hypothesis, root cause, every command run with
      verbatim output, files changed with rationale, and verification output.
      Triggers a mandatory retroactive DIP and QA pass within 24 hours.
    produced_by: harnessable.EmergencyResponder
    consumed_by: harnessable.Engineer
    embedded_in: board_item_or_local_file
    triggers_status: harnessable.BoardStatus.NEEDS_REVISION
    path_convention: docs/mandates/emergency/{YYYY-MM-DD}_{slug}_eir.md
    constraints:
      - root_cause_required: true
      - verification_output_required: true
      - retroactive_note_required: true
        note: >
          Board item must be appended with "[RETROACTIVE] DIP and QA
          verification required within 24h. Findings above require child
          mandates." before the session ends.
      - discovery_classification_required: true
        note: >
          Every finding beyond the immediate bug must be classified as a
          DISCOVERY before the session ends. Unclassified findings in prose
          are a protocol violation.
    retroactive_pass:
      required: true
      window: 24h
      produces: [harnessable.DIP, harnessable.TIR, harnessable.QAVerdict]
    enforcement:
      hook: pre_tool_use/emergency_gate.py
      mechanism: >
        Gate file arms before first code edit. Hook blocks Write/Edit/
        MultiEdit until EIR file exists in docs/mandates/emergency/.
    knowledge_extracted:
      required: true
      timing: before mandate closes
      note: >
        If the failure required Emergency protocol,
        ask whether the pattern should have been in
        world_models/. If yes: this section prevents
        recurrence.
      branches:
        YES: >
          Full pattern encoding matching
          world_models/{domain}_world_model.md pattern format.
          world_models/ update confirmed with commit SHA.
        NO: >
          Explicit declaration required.
          Silence is not permitted.

  harnessable.ADR:
    type: harnessable.Artifact
    label: Architecture Decision Record
    definition: >
      A single entry in the DIP's Architecture Decisions section. Documents
      one non-obvious design choice: what was decided, why, what alternatives
      were considered, and what the decision forecloses.
    produced_by: harnessable.Engineer
    embedded_in: harnessable.DIP
    notes:
      use_when: >
        A reasonable engineer might have decided differently. Obvious choices
        do not require an ADR.

# ─────────────────────────────────────────────────────────────────────────────
# ENUMERATIONS
# ─────────────────────────────────────────────────────────────────────────────

  harnessable.BoardStatus:
    type: harnessable.Enumeration
    definition: >
      The complete set of valid states for a mandate on the project board.
      Every transition has a defined owner, a trigger condition, and invariants
      that must hold. Illegal jumps are protocol violations.
    values:
      BACKLOG:
        definition: Not yet actionable; awaiting prioritisation.
        owner: harnessable.Architect
      MANDATED:
        definition: DMT is complete and approved for execution.
        owner: harnessable.Architect
        requires_artifact: harnessable.DMT
      IN_RECON:
        definition: Engineer is running discovery passes.
        owner: harnessable.Engineer
      PLANNED:
        definition: DIP is complete; ready for the Coder.
        owner: harnessable.Engineer
        requires_artifact: harnessable.DIP
      IN_PROGRESS:
        definition: Coder is actively implementing.
        owner: harnessable.Coder
      IN_REVIEW:
        definition: Implementation complete; awaiting QA.
        owner: harnessable.Coder
        requires_artifact: harnessable.TIR
      BLOCKED:
        definition: Work halted; requires resolution before continuing.
        owner: harnessable.Architect
        triggered_by: harnessable.DiscoveryClass.BLOCKER
      NEEDS_REVISION:
        definition: QA verdict was FAIL; Coder must address findings.
        owner: harnessable.Coder
        triggered_by: harnessable.VerdictOutcome.FAIL
      VERIFIED:
        definition: QA verdict was PASS or CONDITIONAL_PASS.
        owner: harnessable.QA
        triggered_by: [harnessable.VerdictOutcome.PASS,
                       harnessable.VerdictOutcome.CONDITIONAL_PASS]
      DONE:
        definition: Architect accepted the QA verdict; mandate closed.
        owner: harnessable.Architect
        terminal: true

  harnessable.DiscoveryClass:
    type: harnessable.Enumeration
    definition: >
      Classification applied to every field discovery. Determines whether
      work may continue and what actions are required before it does.
    values:
      INFO:
        definition: Noted for awareness. No design change required. Work continues.
        halts_work: false
        requires_dip_update: false
      DEVIATION:
        definition: >
          The implementation or plan must differ from what was written.
          The DIP must be updated before proceeding.
        halts_work: true
        requires_dip_update: true
      BLOCKER:
        definition: >
          Work cannot continue. Requires Architect intervention.
        halts_work: true
        triggers_status: harnessable.BoardStatus.BLOCKED
        requires_child_mandate: true
      HARNESS_IMPROVEMENT:
        definition: >
          A missing or ineffective control was identified. Triggers the
          continuous improvement loop.
        halts_work: false
        triggers: continuous_improvement_loop
        requires_child_mandate: true
        see: references/continuous-improvement.md
        structured_fields:
          gap: required
          stage: required
          proposal: required
          upstream_opportunity: optional — QA only
          propagation: optional — Architect only
        produces: harnessable.ImprovementSignal
        stored_in: harnessable.ImprovementSignalLog
      ONTOLOGY_GAP:
        definition: >
          A concept was encountered during any pipeline stage that does not
          exist in docs/knowledge-graph.yaml. The concept must be declared
          and namespaced in the project graph before work continues. If the
          DIP referenced the concept using a raw label, the DIP must be
          updated to use the namespaced term.
        halts_work: true
        requires_dip_update: true
        requires_graph_amendment: true
        filed_by: [harnessable.Architect, harnessable.Engineer,
                   harnessable.Coder, harnessable.QA]

  harnessable.MandateType:
    type: harnessable.Enumeration
    definition: Classification of a mandate by whether it introduces new work or modifies existing work.
    values:
      new:
        definition: Net-new feature or component with no prior implementation to modify.
      existing:
        definition: Modification, fix, or extension of work that already exists.

# ─────────────────────────────────────────────────────────────────────────────
# EVENTS
# ─────────────────────────────────────────────────────────────────────────────

  harnessable.Discovery:
    type: harnessable.Event
    definition: >
      Filed by any Role when something unexpected is found during execution.
      Must be filed and classified before work continues. Silent deviations —
      proceeding without filing — are a protocol violation.
    filed_by: [harnessable.Architect, harnessable.Engineer,
               harnessable.Coder, harnessable.QA]
    classified_as: harnessable.DiscoveryClass
    constraints:
      - silent_deviation_is_protocol_violation: true

# ─────────────────────────────────────────────────────────────────────────────
# CORE CONCEPTS
# ─────────────────────────────────────────────────────────────────────────────

  harnessable.Mandate:
    type: concept
    definition: >
      The unit of work tracked through the pipeline. Each mandate has a DMT,
      a DIP, a TIR, and a QA Verdict. Mandates are classified by MandateType.
    classified_as: harnessable.MandateType
    composed_of: [harnessable.DMT, harnessable.DIP,
                  harnessable.TIR, harnessable.SIR, harnessable.QAVerdict]
    notes:
      implementation_report: >
        Code mandates produce a TIR; infrastructure mandates produce a SIR.
        Exactly one of the two is required before the QA Verdict.
    tracked_via: harnessable.BoardStatus
    subclasses: [harnessable.MetaMandate, harnessable.ReviewMandate,
                 harnessable.InspectMandate, harnessable.EmergencyMandate,
                 harnessable.ResearchMandate]
    security_review_required: optional
    note: >
      Set by Architect in DMT. When true, Security review runs after
      QA PASS before DONE. A mandate with security_review_required: true
      cannot reach DONE without an SRR.

  harnessable.ReviewMandate:
    type: harnessable.Mandate
    definition: >
      A mandate that invokes the Reviewer role. Exists on the board as
      a quality lifecycle item, not a core pipeline mandate. Does not
      gate any pipeline stage. The Reviewer sets it DONE after filing
      the CRR — no Architect verdict required.
    subclass_of: harnessable.Mandate
    title_prefix: "[REVIEW]"
    dmt_must_declare: [scope, depth, time_budget, finding_threshold]
    sets_done: harnessable.Reviewer
    note: >
      The Reviewer sets DONE — not the Architect. The output is the
      CRR and any child mandates, not a verdict awaiting acceptance.

  harnessable.InspectMandate:
    type: harnessable.Mandate
    definition: >
      A mandate that invokes the Inspector role. Exists on the board as
      a quality lifecycle item, not a core pipeline mandate. Does not
      gate any pipeline stage. The Inspector sets it DONE after filing
      the PIR — no Architect verdict required.
    subclass_of: harnessable.Mandate
    title_prefix: "[INSPECT]"
    dmt_must_declare: [surfaces, capture_method, scenarios,
                       time_budget, finding_threshold]
    sets_done: harnessable.Inspector
    requires: read_only_or_staging_access_confirmed
    note: >
      The Inspector sets DONE — not the Architect. The output is the
      PIR and any child mandates, not a verdict awaiting acceptance.

  harnessable.EmergencyMandate:
    type: harnessable.Mandate
    definition: >
      A mandate opened by the Emergency Responder during a production
      incident. Created under time pressure; skips the BACKLOG → MANDATED →
      IN_RECON → PLANNED sequence and opens directly at IN_PROGRESS. The EIR
      is the sole artifact produced during the emergency session. The mandate
      ends at NEEDS_REVISION to signal that a retroactive DIP and QA pass
      is required before the mandate can reach DONE.
    subclass_of: harnessable.Mandate
    title_prefix: "[EMERGENCY]"
    created_by: harnessable.EmergencyResponder
    first_status: harnessable.BoardStatus.IN_PROGRESS
    terminal_emergency_status: harnessable.BoardStatus.NEEDS_REVISION
    retroactive_requirement:
      within: 24h
      steps:
        - DIP authored from EIR content by Engineer
        - QA verification of the fix
        - Child mandates created for every DISCOVERY filed during the emergency
    primary_artifact: harnessable.EIR
    note: >
      An EmergencyMandate cannot reach DONE without completing the retroactive
      DIP and QA pass. The NEEDS_REVISION status is intentional — it signals
      that the mandate is not yet fully governed, not that the fix failed.
      The EIR substitutes for both DMT and DIP during the emergency.
      The retroactive pass produces a proper DIP and TIR from EIR content.

  harnessable.Harness:
    type: concept
    definition: >
      The operating environment around the model: context, tools, permissions,
      enforcement, verification, and observability. The framework's central
      concept.
    formula: "Model + Context + Tools + Enforcement + Verification + Observability"
    components:
      Context: AGENTS.md — project rules, allowed/blocked actions, completion gate.
      Tools: Controlled tools with schemas, validation, and audit logging.
      Enforcement: PreToolUse hooks — guards that block before execution.
      Verification: Completion gate and independent QA.
      Observability: Audit log, TIR evidence, QA Verdict.

  harnessable.Hook:
    type: concept
    definition: >
      A script configured to run automatically in response to agent lifecycle
      events. Hooks implement the Enforcement Layer — they block or validate
      actions regardless of what the model decides.
    lifecycle_events: [PreToolUse, PostToolUse, Stop]
    dispatcher: hooks/run.py
    extension_model: >
      Drop a .py file into the relevant hooks/ subdirectory. No changes to
      settings.json required.
    see: references/hooks.md

  harnessable.CCSkill:
    type: concept
    definition: >
      A Claude Code custom command that encapsulates a harnessable
      role invocation. Lives at .claude/commands/{role}.md in the
      project. Accepts $ARGUMENTS as the mandate source and resolves
      it via three-case detection: board URL/ID, local file path,
      or inline text. Reads project configuration from AGENTS.md
      rather than hardcoding project-specific values.
    install_path: .claude/commands/{role}.md
    source_template: framework/templates/skills/{role}.md
    tier: framework_owned
    customisation_layer: AGENTS.md
    sync_behaviour: unconditional_replace
    note: >
      Reclassified from Tier 1 (scaffold) to framework-owned in
      June 2026 after full-sync audit found all skill customisations
      were tracker configuration belonging in AGENTS.md.
      No legitimate project extensions were found.
    arguments_cases: [board_url_or_id, local_file_path, inline_text]
    customisation_points:
      - project_tracker_url_pattern_and_fetch_command
      - framework_base_path
    see: framework/vendor/harnessable/references/skills.md

  harnessable.RCA:
    type: concept
    label: Root Cause Analysis
    definition: >
      A structured review of a failure to identify the missing or ineffective
      control that allowed the failure to occur or to reach the stage it did.
    required_for:
      - every HARNESS_IMPROVEMENT discovery
      - any mandate closed with CONDITIONAL_PASS
      - any mandate that passed through NEEDS_REVISION more than once
    focus: >
      The control gap — not the model output. "The model hallucinated" is not
      an RCA. "There was no guard preventing X" is.
    see: references/continuous-improvement.md

  harnessable.ContainmentChecklist:
    type: concept
    definition: >
      Four questions that every non-trivial implementation step in a DIP must
      answer before the Coder touches it. A step with no answer for any of
      these has a design gap.
    questions:
      Detect: How will a failure surface?
      Contain: What prevents it from cascading?
      Recover: What is the rollback path?
      Prevent: What check or policy would catch this class of failure earlier?

  harnessable.BlockedCriterion:
    type: concept
    definition: >
      A DMT acceptance criterion that cannot be independently verified
      because a pre-existing defect in the system prevents it from
      passing regardless of the current mandate's implementation.
      Not a Coder failure — a DMT validity failure that requires
      Architect intervention.
    detection_roles: [harnessable.Architect, harnessable.Engineer,
                      harnessable.Coder, harnessable.QA]
    discovery_class: harnessable.DiscoveryClass.BLOCKER
    discovery_label: BLOCKED_CRITERION
    severity: BLOCKER
    conditional_pass_eligible: false
    tir_completion_permitted: false
    architect_resolution_options:
      rewrite_criterion:
        definition: >
          Remove or replace the criterion to exclude the dependency
          on the broken behaviour. New criterion must pass all three
          validity rules independently.
      file_prerequisite_mandate:
        definition: >
          File a mandate to fix the blocking bug. Current mandate
          declared dependent on prerequisite reaching DONE.
          Current mandate must not advance past PLANNED until
          prerequisite is DONE.
      accept_with_documented_risk:
        definition: >
          Architect explicitly accepts the criterion cannot be fully
          verified. Documented in DMT ## Post-Close Notes.
          Rare — requires explicit written Architect decision.
          QA must be informed before issuing any verdict.
    constraint: >
      A TIR claiming a BLOCKED_CRITERION passed is a false evidence
      claim equivalent to fabricating test output. Protocol violation
      requiring classifier review against
      framework/vendor/harnessable/references/error-modes.md.

  harnessable.PrerequisiteMandate:
    type: concept
    definition: >
      A mandate that must reach DONE before another mandate's acceptance
      criteria can be verified. Declared in the dependent mandate's DMT
      ## Prerequisites section by the Architect. Creates a hard ordering
      dependency between two mandates.
    declared_in: "DMT ## Prerequisites section"
    filed_by: harnessable.Architect
    blocks_dependent_mandate_at: harnessable.BoardStatus.PLANNED
    constraint: >
      A dependent mandate must not advance past PLANNED until all
      declared prerequisite mandates are DONE. Engineer must confirm
      prerequisite status during Pass 7 Criterion Validity Audit.

  harnessable.ExternalFact:
    type: concept
    definition: >
      Any claim in a DIP, TIR, or mandate artifact about the current
      state of a system outside the project's own codebase: package
      compatibility, API surface, deprecation status, SDK constraints,
      rate limits, quota values, or authentication schemes.
      Training knowledge is insufficient for ExternalFacts. They must
      be verified against a live-fetched source at the installed version.
    properties:
      requires_live_verification: true
      training_knowledge_insufficient: true
      cite_url_and_date: true
    verification_pattern: >
      Resolve installed version → construct versioned URL →
      fetch live → cite URL and fetch date in Recon Findings.
    filed_by: [harnessable.Engineer, harnessable.Coder, harnessable.QA]
    failure_mode: >
      Citing training knowledge as authoritative for an ExternalFact.
      Classic presentation: agent fetches docs for a prior major version
      because training data knew that URL; installed version has different
      compatibility table. Results in false BLOCKER or false PASS.
    tool: docs/harness/tools/web_verify.py
    discovery_class_if_wrong: harnessable.DiscoveryClass.DEVIATION
    constraint: >
      A DIP section that makes an ExternalFact claim without a cited
      URL and fetch date is incomplete. QA may reject the TIR on
      this basis as a requirements / mandate failure; classify using
      framework/vendor/harnessable/references/error-modes.md.
    see: framework/agents/engineer.md — Pass 4

  harnessable.TrainingCutoff:
    type: concept
    definition: >
      The point in time after which an agent's training data contains
      no information. All knowledge of external systems — APIs, packages,
      platform documentation, compatibility tables — reflects the world
      as it was at or before the cutoff. The cutoff is not visible to
      the agent during operation and cannot be reliably self-reported.
    properties:
      agent_self_knowledge: unreliable
      affects: [harnessable.ExternalFact]
    implication: >
      The TrainingCutoff is not a model limitation to work around —
      it is an engineering constraint to design for. The same discipline
      that requires a human engineer to verify specifications before
      implementing applies here. Design the workflow to fetch live
      rather than to assume training knowledge is current.
    mitigation: harnessable.ExternalFact verification via web_verify.py
    encoded_in: framework/agents/engineer.md — Pass 4

# ─────────────────────────────────────────────────────────────────────────────
# RSI — RECURSIVE SELF-IMPROVEMENT
# ─────────────────────────────────────────────────────────────────────────────

  harnessable.FrameworkObservation:
    type: concept
    definition: >
      The structured output of the RSI closing ritual performed by any role
      at the end of every session. Produced unconditionally — regardless of
      whether anything went wrong. A clean session with no gaps is recorded
      explicitly; silence is not a valid observation.
    produced_by: [harnessable.Architect, harnessable.Engineer,
                  harnessable.Coder, harnessable.QA]
    properties:
      mandatory: true
      conditional_on_failure: false
    valid_values:
      no_gaps:
        definition: >
          No protocol gaps were identified this session. Recorded explicitly
          in the role's output artifact (TIR, DIP, QA Verdict, board note).
        produces: harnessable.ImprovementSignal
        signal_type: null
      gap_identified:
        definition: >
          A protocol gap was identified. A HARNESS_IMPROVEMENT discovery is
          filed with structured fields before the role's session closes.
        produces: harnessable.ImprovementSignal
        signal_type: harnessable.DiscoveryClass.HARNESS_IMPROVEMENT
    recorded_in:
      Architect: "board item closing note"
      Engineer: "DIP ## Recon Findings — committed in chore(recon):"
      Coder: "TIR ## Implementation Notes"
      QA: "QA Verdict section — Phase 8"

  harnessable.ImprovementSignal:
    type: concept
    definition: >
      A single structured record of a framework gap observation, written
      to the improvement signal log. One signal per HARNESS_IMPROVEMENT
      discovery. The log accumulates signals across mandates and sessions;
      the Architect checks it at every mandate closure for recurrence.
    produced_by: [harnessable.Architect, harnessable.Engineer,
                  harnessable.Coder, harnessable.QA]
    stored_in: harnessable.ImprovementSignalLog
    fields:
      gap:
        definition: What was missing or inadequate in the framework protocol.
        required: true
      stage:
        definition: >
          Which pipeline stage or protocol phase surfaced the gap.
          Engineer uses recon pass name. Coder uses implementation step.
          QA uses phase number. Architect uses pipeline position.
        required: true
      proposal:
        definition: What a better control or protocol element would look like.
        required: true
      upstream_opportunity:
        definition: >
          At which earlier pipeline stage could a control have prevented
          this gap from being encountered here. QA-specific field; other
          roles may omit if not applicable.
        required: false
        filed_by: harnessable.QA
      propagation:
        definition: >
          Number of pipeline stages the gap traveled before being detected.
          See harnessable.PropagationDistance. Architect-specific field.
        required: false
        filed_by: harnessable.Architect
      mandate_id:
        definition: The board item ID or mandate slug of the originating mandate.
        required: true
      session_ts:
        definition: ISO 8601 timestamp of the session in which the gap was observed.
        required: true
      gap_class:
        definition: >
          A short label for the category of gap. Used for recurrence detection.
          Examples: "git_state_not_verified", "completion_gate_absent",
          "dmt_acceptance_criterion_ambiguous", "discovery_class_inadequate".
        required: true

  harnessable.ImprovementSignalLog:
    type: concept
    definition: >
      The append-only NDJSON file that accumulates all ImprovementSignal
      entries across all mandates and sessions. Never truncated by the
      framework. Operators decide purging policy.
    path_convention: .harness/improvement-signals.jsonl
    format: NDJSON
    properties:
      append_only: true
      operator_purge_only: true
    written_by:
      automatic: pre_compact/mandate_snapshot.py
      manual: Architect during Mandate Closure Discipline Step 4
    read_by: harnessable.Architect
    triggers: harnessable.MetaMandate

  harnessable.PropagationDistance:
    type: concept
    definition: >
      The number of pipeline stages a framework gap traveled from its
      point of origin before it was detected and filed. Measured in role
      transitions: a gap introduced at Architect (DMT) and caught at QA
      has a propagation distance of 3 (Engineer, Coder, QA). A gap
      introduced at Engineer recon and caught at QA has a distance of 2.
    unit: pipeline_stages
    calculated_by: harnessable.Architect
    recorded_in: harnessable.ImprovementSignal.propagation
    interpretation:
      high:
        threshold: "≥ 3"
        meaning: >
          The existing controls allowed the gap to travel far before
          detection. High improvement priority — earlier controls needed.
      low:
        threshold: "≤ 1"
        meaning: >
          Existing controls caught the gap near its origin. The pipeline
          is working; improvement is optimisation, not remediation.

  harnessable.MetaMandate:
    type: harnessable.Mandate
    definition: >
      A mandate whose codebase is the harnessable framework itself.
      Triggered automatically when the same gap_class appears in three
      or more ImprovementSignal entries in the signal log. Runs through
      the full pipeline: Architect defines the improvement, Engineer
      designs it, Coder implements it in the framework files, QA verifies.
      The framework improves itself by governing itself.
    subclass_of: harnessable.Mandate
    triggered_by: harnessable.ImprovementSignalLog
    trigger_threshold:
      recurrence_count: 3
      matching_field: gap_class
    title_format: >
      [HARNESS_META] {gap_class}: observed in {n} mandates —
      propose and implement framework improvement
    codebase: harnessable framework files
    created_by: harnessable.Architect
    created_when: harnessable.BoardStatus.DONE transition (before setting DONE)
    properties:
      mandatory_when_threshold_crossed: true
      advisory: false
    note: >
      The MetaMandate is not a suggestion. When the threshold is crossed,
      creating it is a precondition for setting DONE on the triggering mandate.

  harnessable.ResearchMandate:
    type: harnessable.Mandate
    definition: >
      A mandate scoping an Analyst session. Declares investigation
      domain, signal types, time window, source platforms, and the
      decision the IB should inform. Managed by Analyst to DONE
      without Architect acceptance gate.
    title_prefix: "[RESEARCH]"
    subclass_of: harnessable.Mandate
    dmt_must_declare: [domain, signal_types, time_window,
                       source_platforms, output_expectation]
    sets_done: harnessable.Analyst

  harnessable.CredentialOps:
    type: concept
    definition: >
      A session-scoped declaration of credential files an SRE mandate
      will write, verify, or transfer. Declared in DIP ## Credential
      Operations, signed off at MANDATED. Creates a governed exemption
      in secrets_guard for verify-only operations on declared files.
      Never permits content-exposing reads. Cleaned up at session end.
    path: .harnessable/credential_ops.json
    scope: session
    fields:
      session_id: ISO timestamp of session start
      mandate: path to the authorising DIP
      approved_paths: list of credential file paths
      expires_at: ISO 8601 expiry (max 4 hours from creation)
    lifecycle:
      created_by: harnessable.SRE at session start
      cleaned_by: stop/credential_ops_cleanup.py
    audit: every exempted access logged with credential_op_exemption:true

  harnessable.VerifyOnlyPattern:
    type: concept
    definition: >
      A shell command that accesses credential file metadata or
      structure without exposing content. The only class of credential
      file access that can be governed by CredentialOps exemption.
    examples:
      - "wc -l {file}"
      - "wc -c {file}"
      - "md5sum {file}"
      - "sha256sum {file}"
      - "stat {file}"
      - "ls -la {file}"
      - "grep -c '^KEY' {file}"
      - "grep -q '^KEY=' {file}"
    always_blocked_regardless_of_exemption:
      - "cat {file}"
      - "less {file}"
      - "head {file}"
      - "tail {file}"
      - "echo $VAR"
      - "printenv"

  harnessable.Evolver:
    type: harnessable.IndependentRole
    definition: >
      Acts on what the Dreamer named. Reads accumulated
      Dream Reports and open Protocol Enhancement
      Requests and applies natural selection to the
      current roster generation. Creates roles the
      corpus shows are needed. Mutates protocols the
      evidence shows are wrong. Merges roles that prove
      redundant. Deprecates roles that no longer fit.
      Extinccts roles the fleet has stopped using.
      The framework's fitness function made executable.
      Does not read raw corpus — only Dream Reports
      and PERs. One tool, one job.
    inputs:
      primary:
        - Dream Reports (docs/dreams/DR-*.md)
        - Protocol Enhancement Requests
          (docs/mandates/per/PER-*.md)
      boundary: last_evolution.json
    trigger: signal density (N Dream Reports OR
              M consecutive patterns OR
              PER backlog threshold)
    evolution_actions:
      - CREATE (new role)
      - MUTATE (existing role protocol)
      - MERGE (two roles into one)
      - DEPRECATE (mark end-of-life)
      - EXTINCT (remove from roster)
    produces: harnessable.EvolutionReport
    executes: Evolution collapse (last_evolution.json)
    resolves: harnessable.ProtocolEnhancementRequest

  harnessable.EvolutionReport:
    type: harnessable.Artifact
    label: Evolution Report
    abbreviation: ER
    path_convention: docs/evolutions/ER-{NNN}.md
    produced_by: harnessable.Evolver
    consumed_by: harnessable.Orchestrator
    sections:
      - Roster diff (before/after)
      - Actions taken (CREATE/MUTATE/MERGE/DEPRECATE/EXTINCT)
      - PER resolutions
      - Signals deferred
      - Signals to watch
    failure_mode: >
      Evolution without collapse = Dream Reports
      accumulate as EVOLVED debt.
      Action without sufficient evidence = noise
      in the roster.

  harnessable.EvolutionAction:
    type: concept
    definition: >
      One of five actions the Evolver applies to
      the roster based on pattern evidence from
      Dream Reports and PERs.
    actions:
      CREATE:
        evidence: 3+ PERs or Dream Reports
        produces: new framework/agents/{name}.md
      MUTATE:
        evidence: 3+ sessions with wrong outcomes
        produces: updated framework/agents/{role}.md
      MERGE:
        evidence: two roles always commissioned together
        produces: survivor file, extinct merged file
      DEPRECATE:
        evidence: role not commissioned in 3+ Dream cycles
        produces: deprecation notice at top of agent file
      EXTINCT:
        evidence: prior deprecation period elapsed
        produces: role removed from roster
    threshold_principle: >
      A single PER or Dream Report is noise.
      The same signal across 3+ instances is a pattern.
      The same pattern across 5+ instances is a defect.
      Only patterns warrant Evolution actions.

  harnessable.Package:
    type: concept
    definition: >
      A third-party tool, skill, or library that
      provides domain expertise to harnessable-governed
      pipelines. Lives where installed — harnessable
      never copies or modifies it. Connected to
      harnessable via a PackageAdapter that provides
      discovery, governance bridge, and Rubric
      integration without touching the package itself.
    lives_at: install_path (declared in PACKAGE.md)
    connected_via: harnessable.PackageAdapter
    examples:
      - hallmark (design execution + slop gates)
      - playwright (browser testing)
      - terraform (infrastructure tooling)
    principle: >
      The package provides domain expertise.
      harnessable provides governance.
      Neither needs to know the other's internals.

  harnessable.PackageManifest:
    type: harnessable.Artifact
    label: Package Manifest
    abbreviation: PACKAGE.md
    definition: >
      Declares what a package adapter wraps and what
      it contributes to the harnessable pipeline.
      Required in every packages/{name}/ directory.
      The harnessable: block is read by the Engineer
      during roster scan to discover skills, role
      extensions, and Rubric additions.
    path_convention: packages/{name}/PACKAGE.md
    template: framework/templates/package.md
    required_fields:
      - name
      - source
      - install_path
      - capabilities
      - harnessable.extends_role
      - harnessable.adds_skills
      - harnessable.requires

  harnessable.HallmarkAdapter:
    type: harnessable.PackageAdapter
    label: Hallmark Adapter
    definition: >
      The inaugural harnessable package adapter.
      Governance bridge for Hallmark — anti-AI-slop
      design skill by Nutlope / Together AI. Provides
      /hallmark and /hallmark-study skill wrappers,
      Designer role extension, 65-gate slop Rubric,
      and design domain world model template. Hallmark
      lives at ~/.agents/skills/hallmark/ — the adapter
      at packages/hallmark/ does not copy it.
    package: Hallmark (nutlope/hallmark)
    install_cmd: npx skills add nutlope/hallmark
    extends_role: harnessable.Designer
    adds_skills:
      - /hallmark (design execution)
      - /hallmark-study (DNA extraction)
    rubric: packages/hallmark/adapter/rubric.md
    corpus_input: .hallmark/log.json
    world_model: packages/hallmark/adapter/design_world_model.md
    principle: >
      Hallmark provides design intelligence.
      harnessable provides governance.
      The adapter bridges without copying.
